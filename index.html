<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANGENX - 卡密管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Yue 風格專屬：深色背景與霓虹呼吸燈特效 */
        body {
            background-color: #0b0b0f;
            background-image: radial-gradient(circle at 50% -20%, #3b0764 0%, #0b0b0f 60%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .neon-shadow {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .neon-border {
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .glass-card {
            background: rgba(17, 17, 24, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen pb-12">

    <nav class="border-b border-gray-800 bg-opacity-70 bg-[#0d0d12] backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center neon-shadow">
                    <span class="text-white font-extrabold text-lg">Y</span>
                </div>
                <span class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">YANGENX PANEL</span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs bg-purple-950/50 text-purple-400 border border-purple-800/50 px-3 py-1 rounded-full">管理員模式</span>
                <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
                    <i class="fa-solid fa-user-shield text-purple-400"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-8">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">卡密總數</p>
                    <h3 class="text-3xl font-extrabold mt-1 text-white" id="totalKeys">--</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-purple-500/10 flex items-center justify-center border border-purple-500/20 text-purple-400 text-xl">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
            <div class="glass-card p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">已啟用 / 已綁定</p>
                    <h3 class="text-3xl font-extrabold mt-1 text-emerald-400" id="activeKeys">--</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 text-emerald-400 text-xl">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>
            </div>
            <div class="glass-card p-6 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">今日上線人數</p>
                    <h3 class="text-3xl font-extrabold mt-1 text-indigo-400" id="todayActive">--</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 text-indigo-400 text-xl">
                    <i class="fa-solid fa-users-viewfinder"></i>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-2xl overflow-hidden neon-border">
            
            <div class="p-6 border-b border-gray-800 bg-[#12121a]/50 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                        卡密列表與狀態監控
                    </h2>
                    <p class="text-xs text-gray-400 mt-1">即時同步 Supabase 安全授權資料庫</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="fetchData()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl text-sm transition-all flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> 重新整理
                    </button>
                    <button onclick="toggleModal(true)" class="px-5 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl text-sm font-semibold transition-all neon-shadow flex items-center gap-2 text-white">
                        <i class="fa-solid fa-plus"></i> 批量生成卡密
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 bg-[#0f0f15] text-xs font-semibold text-gray-400 uppercase tracking-wider">
                            <th class="py-4 px-6">卡密 (License Key)</th>
                            <th class="py-4 px-6">預設使用者</th>
                            <th class="py-4 px-6">硬體綁定鎖 (HWID)</th>
                            <th class="py-4 px-6">到期時間</th>
                            <th class="py-4 px-6">最後上線</th>
                            <th class="py-4 px-6 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="licenseTableBody" class="divide-y divide-gray-800/50 text-sm">
                        <tr>
                            <td colspan="6" class="py-12 text-center text-gray-500">
                                <i class="fa-solid fa-spinner animate-spin text-2xl mb-2 block"></i>
                                正在載入伺服器資料...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="generateModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="glass-card max-w-md w-full rounded-2xl p-6 neon-border">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> 生成全新授權卡密
                </h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-white text-xl">×</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">自訂卡密前綴</label>
                    <input id="keyPrefix" type="text" placeholder="例如: YANG-" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">預設使用者名稱</label>
                    <input id="keyUser" type="text" placeholder="例如: Hsinenn_Test" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">有效天數 (輸入 0 為永久)</label>
                    <input id="keyDays" type="number" value="30" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-white">
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="toggleModal(false)" class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl text-sm font-semibold transition-all">
                    取消
                </button>
                <button onclick="generateKeys()" class="flex-1 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl text-sm font-semibold text-white transition-all neon-shadow">
                    開始生成
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 請換成你部署在 Render 的 API 網址 🌟
        const API_URL = "https://yangenx-license-api.onrender.com/api";

        // 控制 Modal 顯示
        function toggleModal(show) {
            document.getElementById('generateModal').classList.toggle('hidden', !show);
        }

        // 格式化日期顯示
        function formatDate(dateStr) {
            if (!dateStr) return '<span class="text-gray-600">無</span>';
            const d = new Date(dateStr);
            if (d.getFullYear() > 9000) return '<span class="text-purple-400 font-semibold">永久授權</span>';
            return d.toLocaleString('zh-TW', { hour12: false });
        }

        // 1. 從後端 API 獲取卡密列表
        async function fetchData() {
            try {
                // 這裡要呼叫你後端的「獲取所有卡密」的 API（例如：GET /api/admin/licenses）
                // 暫時使用模擬請求，並指引你如何對接
                const response = await fetch(`${API_URL}/licenses`);
                const data = await response.json();
                
                renderTable(data);
            } catch (error) {
                console.error("無法取得資料，正在載入本地端模擬資料以利測試...", error);
                // ⚠️ 備用模擬資料，讓你的 UI 直接有畫面可以展示
                showMockData();
            }
        }

        // 2. 渲染表格
        function renderTable(list) {
            const tbody = document.getElementById('licenseTableBody');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500">目前資料庫中沒有卡密。</td></tr>`;
                return;
            }

            // 更新數據看板
            document.getElementById('totalKeys').innerText = list.length;
            document.getElementById('activeKeys').innerText = list.filter(k => k.hwid).length;
            document.getElementById('todayActive').innerText = list.filter(k => k.last_seen_at).length;

            list.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition-all">
                        <td class="py-4 px-6 font-mono text-purple-300 font-bold tracking-wide">${item.license_key}</td>
                        <td class="py-4 px-6">${item.username || '<span class="text-gray-500">未命名</span>'}</td>
                        <td class="py-4 px-6 max-w-xs truncate font-mono text-xs text-gray-400" title="${item.hwid || '尚未綁定'}">
                            ${item.hwid ? `<span class="text-blue-400"><i class="fa-solid fa-lock"></i> ${item.hwid.substring(0,12)}...</span>` : '<span class="text-gray-600">🆕 尚未綁定</span>'}
                        </td>
                        <td class="py-4 px-6 text-xs text-gray-300">${formatDate(item.expires_at)}</td>
                        <td class="py-4 px-6 text-xs text-gray-400">${formatDate(item.last_seen_at)}</td>
                        <td class="py-4 px-6 text-right">
                            <button onclick="deleteKey('${item.license_key}')" class="text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
                                <i class="fa-solid fa-trash-can"></i> 刪除
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. 模擬資料展示 (如果 API 還沒寫完時可供預覽)
        function showMockData() {
            const mockData = [
                { license_key: "YANG-TEST-888", username: "Hsinenn_Test", hwid: "FALLBACK-MY-PC-123", expires_at: "9999-09-09T09:09:09Z", last_seen_at: new Date().toISOString() },
                { license_key: "YANG-WEEK-555", username: "GenshinPlayer", hwid: null, expires_at: "2026-07-23T15:30:00Z", last_seen_at: null }
            ];
            renderTable(mockData);
        }

        // 4. API 呼叫：刪除卡密
        async function deleteKey(key) {
            if (!confirm(`確定要刪除卡密 ${key} 嗎？此動作無法復原！`)) return;
            try {
                const response = await fetch(`${API_URL}/licenses/${key}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('刪除成功！');
                    fetchData();
                }
            } catch (err) {
                alert('刪除失敗，請檢查 API：' + err.message);
            }
        }

        // 5. API 呼叫：生成卡密
        async function generateKeys() {
            const prefix = document.getElementById('keyPrefix').value;
            const user = document.getElementById('keyUser').value;
            const days = parseInt(document.getElementById('keyDays').value);

            const requestData = {
                prefix: prefix || "YANG-",
                username: user || "Hsinenn_Test",
                days: days
            };

            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    alert('卡密成功存入 Supabase！');
                    toggleModal(false);
                    fetchData();
                } else {
                    alert('生成失敗，請確認後台 API 端點是否有開放 /generate');
                }
            } catch (err) {
                alert('連線失敗：' + err.message);
            }
        }

        // 網頁開啟時自動載入資料
        window.onload = fetchData;
    </script>
</body>
</html>
